<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../pages/home_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>GymTrack - Home</title>
</head>

<body onload="controllaLoggato()">

    <div id="main-container" style="display: block;">
        <h1>Benvenuto su GymTrack!</h1>
        <p>Il tuo compagno ideale per tenere traccia dei tuoi allenamenti e raggiungere i tuoi obiettivi fitness.</p>

        <div class="shortcut-column-bar">
            <button onclick="openWorkout()"><i class="fa-solid fa-plus"></i> Nuovo Allenamento</button>
            <button onclick="openProfile()"><i class="fa-solid fa-user"></i> Profilo</button>
            <button><i class="fa-solid fa-trophy"></i> Obiettivi Mese</button>
        </div>
    </div>

    <button id="logout-button" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Esci
    </button>

    <div id="nav-bar">
        <div class="user-profile-header">
            <img src="../img/bg_index1.png" width="100" height="100" id="profile-pic">
            <p id="show-username"></p>
        </div>
        <ul>
            <li><button onclick="openHome()"><i class="fa-solid fa-house"></i> Inizio</button></li>
            <li><button onclick="openWorkout()"><i class="fa-solid fa-dumbbell"></i> Allenamento</button></li>
            <li><button><i class="fa-solid fa-arrow-trend-up"></i> Progressi</button></li>
            <li><button onclick="openProfile()"><i class="fa-solid fa-user"></i> Profilo</button></li>
            <li><i class="fa-solid fa-sun" id="change-theme" onclick="changeTheme()"></i></li>
        </ul>
    </div>

    <div id="startworkout-container" style="display: none;">
        <button id="btnStart" onclick="startWorkout()">Avvia un nuovo allenamento</button>
    </div>

    <div id="workout-container" style="display: none;">
        <button id="btnClock" onclick="openClock()"><i class="fa-solid fa-stopwatch"></i></button>
        <button id="btnSpotify" onclick="openSpotify()"><i class="fa-brands fa-spotify"></i></button>
        <button id="btnEnd" onclick="endWorkout()">Termina</button>

        <div id="info-workout">
            <div id="info-duration">
                <h3>Durata</h3>
                <p id="duration-value">0:00:00</p>
            </div>
            <div id="info-volume">
                <h3>Volume</h3>
                <p id="volume-value">0kg</p>
            </div>
            <div id="info-set">
                <h3>Set</h3>
                <p id="set-value">0</p>
            </div>
        </div>
    </div>

    <div id="profile-container" style="display: none;">
        <hr>
        <h2>Profilo</h2>
        <img id="profile-pic" src="../img/bg_index1.png" width="100" height="100">
        <br>
        <div id="more-info">
            <div class="info-box">
                <p class="value" id="n-workout"></p>
                <p class="head" id="head-n-workout">Allenamenti</p>
            </div>
            <div class="info-box">
                <p class="value" id="n-follower"></p>
                <p class="head" id="head-n-follower">Follower</p>
            </div>
            <div class="info-box">
                <p class="value" id="n-follow"></p>
                <p class="head" id="head-n-follow">Seguiti</p>
            </div>
        </div>
        <button id="btnChangePic" onclick="changePic()">Cambia Immagine Profilo</button>
        <br>
        <i class="fa-solid fa-user"></i><label>Username:</label><input type="text" id="profile-username">
        <br>
        <i class="fa-solid fa-envelope"></i><label>E-mail:</label><input type="text" id="profile-email" readonly>
        <hr>
        <h2>Social Media</h2>
        <span class="social-trigger" onclick="openInsta()">
            <i class="fa-brands fa-instagram"></i><label>Instagram:</label>
        </span>
        <input type="text" id="profile-instagram">
        <br>
        <span class="social-trigger">
            <i class="fa-brands fa-facebook"></i><label>Facebook:</label>
        </span>
        <input type="text" id="profile-facebook">
    </div>

</body>
<script src="../pages/home_script.js"></script>

</html>
